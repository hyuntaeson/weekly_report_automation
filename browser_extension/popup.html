<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Report Activity Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 300px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0;
            margin: 0;
        }
        
        .container {
            padding: 20px;
            color: #fff;
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .toggle-section {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .toggle-label {
            font-size: 13px;
            font-weight: 500;
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
            border: none;
            padding: 0;
        }
        
        .toggle-switch.active {
            background-color: #48bb78;
        }
        
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: white;
            border-radius: 12px;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        
        .toggle-switch.active::after {
            left: 24px;
        }
        
        .status-text {
            font-size: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0.9;
        }
        
        .status-text.enabled::before {
            content: '✓ ';
            color: #48bb78;
            font-weight: bold;
        }
        
        .status-text.disabled::before {
            content: '✕ ';
            color: #f56565;
            font-weight: bold;
        }
        
        .info-section {
            font-size: 11px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0.8;
            line-height: 1.5;
        }
        
        .info-section strong {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .footer {
            font-size: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0.7;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 활동 추적</h1>
            <p>웹페이지 방문 기록 수집</p>
        </div>
        
        <div class="toggle-section">
            <div class="toggle-row">
                <span class="toggle-label">추적 활성화</span>
                <button class="toggle-switch active" id="toggleButton"></button>
            </div>
            
            <div class="status-text enabled" id="statusText">
                활동 추적 중
            </div>
            
            <div class="info-section">
                <strong>📝 수집 정보:</strong>
                URL, 페이지 제목, 방문 시각만 수집합니다.
                <br><br>
                민감한 URL(로그인, 은행 등)은 자동 제외됩니다.
            </div>
            
            <div class="info-section">
                <strong>🖥️ 요구사항:</strong>
                로컬 서버가 실행되어야 합니다:
                <br>
                <code style="display: block; margin-top: 5px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 4px;">
                    python browser_<br>activity_server.py
                </code>
            </div>
        </div>
        
        <div class="footer">
            v1.0.0 | Weekly Report Automation
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
